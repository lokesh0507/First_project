# .github/workflows/generate-graph.yml
# ──────────────────────────────────────────────
# Generates dependency graph automatically
# Runs on push to main
# ──────────────────────────────────────────────

name: Generate Dependency Graph

on:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types: [dependency-changed]

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest

    steps:
      # ✅ Step 1 — Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Step 2 — Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ✅ Step 3 — Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ✅ Step 4 — Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ✅ Step 5 — Add GitHub NuGet Source
      # FIXED: Added --store-password-in-clear-text
      # WHY: GitHub Actions runs on Linux/Ubuntu
      # WHY: Linux does not support password encryption
      # WHY: --store-password-in-clear-text is the fix
      # WHY: Safe because token is from GitHub Secrets
      # - name: Add GitHub NuGet Source
      #   run: |
      #     dotnet nuget add source \
      #       "https://nuget.pkg.github.com/lokesh0507/index.json" \
      #       --name "github" \
      #       --username "lokesh0507" \
      #       --password ${{ secrets.SCANNER_PAT }} \
      #       --store-password-in-clear-text

      # ✅ Step 6 — Clone external iot repos
      - name: Clone external repos
        run: python tools/deps-scanner/clone_repos.py
        env:
          SCANNER_PAT: ${{ secrets.SCANNER_PAT }}

      # ✅ Step 7 — Run dependency scanner
      - name: Run dependency scanner
        run: python tools/deps-scanner/scan.py

      # ✅ Step 8 — Commit and push dependency graph
      - name: Commit and push dependency graph
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/deps.md output/deps.html
          git diff --staged --quiet || git commit -m "Auto-update dependency graph [skip ci]"
          git push

      # ✅ Step 9 — Upload as artifact
      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            output/deps.md
            output/deps.html